[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "inflation-forecast-nowcast"
version = "0.0.0"
description = "Inflation forecast evaluation and ragged-edge Germany nowcasts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "matplotlib>=3.8,<4",
    "typer>=0.12,<1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.9.1",
    "requests>=2.34.2",
    "reportlab>=5.0.1",
    "pypdf>=6.19.0",
    "pandas-stubs>=3.0.5.260914",
    "types-requests>=2.33.0.20261006",
]
[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "types-PyYAML", "detect-secrets"]
[tool.hatch.build.targets.wheel]
packages = ["src/inflation_forecast_nowcast"]
[tool.ruff]
extend-exclude = ["versions"]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=inflation_forecast_nowcast --cov-report=term-missing --cov-fail-under=70"
